<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350">
  <defs>
    <linearGradient id="prevBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0a2e"/>
      <stop offset="100%" style="stop-color:#0a0515"/>
    </linearGradient>
    <linearGradient id="progressBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c084fc"/>
      <stop offset="100%" style="stop-color:#00d2be"/>
    </linearGradient>
  </defs>
  <rect width="500" height="350" fill="url(#prevBg)"/>
  
  <!-- Header area -->
  <rect x="20" y="20" width="460" height="80" rx="6" fill="rgba(192,132,252,0.08)" stroke="rgba(192,132,252,0.2)" stroke-width="1"/>
  
  <!-- Logo placeholder in header -->
  <circle cx="60" cy="60" r="25" fill="rgba(192,132,252,0.15)" stroke="#c084fc" stroke-width="1.5"/>
  <text x="60" y="65" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#c084fc">PUFC</text>
  
  <!-- Campaign title -->
  <text x="100" y="48" font-family="sans-serif" font-size="13" font-weight="bold" fill="white">Prestige Union Football Club</text>
  <text x="100" y="68" font-family="sans-serif" font-size="11" fill="#b0b0b0">Fund Raising Campaign</text>
  <text x="100" y="85" font-family="sans-serif" font-size="9" fill="#888">gogetfunding.com</text>
  
  <!-- Progress section -->
  <rect x="20" y="115" width="460" height="70" rx="6" fill="rgba(0,210,190,0.05)" stroke="rgba(0,210,190,0.15)" stroke-width="1"/>
  
  <!-- Progress bar background -->
  <rect x="40" y="135" width="420" height="12" rx="6" fill="rgba(255,255,255,0.1)"/>
  <!-- Progress bar fill -->
  <rect x="40" y="135" width="180" height="12" rx="6" fill="url(#progressBar)"/>
  
  <!-- Amount text -->
  <text x="40" y="168" font-family="sans-serif" font-size="11" font-weight="bold" fill="#00d2be">Funds Raised</text>
  <text x="400" y="168" text-anchor="end" font-family="sans-serif" font-size="11" fill="#888">Goal Target</text>
  
  <!-- Campaign description area -->
  <rect x="20" y="200" width="460" height="100" rx="6" fill="rgba(212,175,55,0.05)" stroke="rgba(212,175,55,0.15)" stroke-width="1"/>
  
  <!-- Description lines -->
  <rect x="40" y="220" width="300" height="8" rx="4" fill="rgba(255,255,255,0.15)"/>
  <rect x="40" y="238" width="380" height="8" rx="4" fill="rgba(255,255,255,0.1)"/>
  <rect x="40" y="256" width="260" height="8" rx="4" fill="rgba(255,255,255,0.1)"/>
  <rect x="40" y="274" width="340" height="8" rx="4" fill="rgba(255,255,255,0.08)"/>
  
  <!-- Donate button -->
  <rect x="160" y="315" width="180" height="25" rx="12" fill="url(#progressBar)"/>
  <text x="250" y="332" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="white">DONATE NOW</text>
  
  <!-- Decorative elements -->
  <circle cx="450" cy="50" r="3" fill="#d4af37" opacity="0.5"/>
  <circle cx="460" cy="65" r="2" fill="#00d2be" opacity="0.4"/>
  <circle cx="440" cy="75" r="2" fill="#c084fc" opacity="0.4"/>
</svg>
