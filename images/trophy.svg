<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250">
  <defs>
    <linearGradient id="trophyGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4af37"/>
      <stop offset="50%" style="stop-color:#f0d060"/>
      <stop offset="100%" style="stop-color:#b8962e"/>
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0a2e"/>
      <stop offset="100%" style="stop-color:#12082a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="250" fill="url(#bg)"/>
  <!-- Terrain lines background -->
  <path d="M0 30 Q100 20 200 35 Q300 50 400 25" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="0.7"/>
  <path d="M0 50 Q100 40 200 55 Q300 70 400 45" fill="none" stroke="rgba(0,210,190,0.06)" stroke-width="0.7"/>
  <path d="M0 220 Q100 210 200 225 Q300 240 400 215" fill="none" stroke="rgba(212,175,55,0.06)" stroke-width="0.7"/>
  <path d="M0 235 Q100 225 200 240 Q300 250 400 230" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="0.5"/>
  <!-- Trophy cup -->
  <path d="M160 60 L240 60 L230 130 Q200 160 170 130 Z" fill="url(#trophyGold)" opacity="0.9"/>
  <!-- Trophy handles -->
  <path d="M160 70 Q120 70 120 100 Q120 125 155 125" fill="none" stroke="#d4af37" stroke-width="4" stroke-linecap="round"/>
  <path d="M240 70 Q280 70 280 100 Q280 125 245 125" fill="none" stroke="#d4af37" stroke-width="4" stroke-linecap="round"/>
  <!-- Trophy stem -->
  <rect x="190" y="155" width="20" height="30" fill="#d4af37"/>
  <!-- Trophy base -->
  <rect x="165" y="185" width="70" height="10" rx="3" fill="#d4af37"/>
  <rect x="155" y="195" width="90" height="12" rx="3" fill="#b8962e"/>
  <!-- Shine effect -->
  <path d="M180 70 L185 70 L178 120 L175 120 Z" fill="white" opacity="0.2"/>
  <!-- Stars around trophy -->
  <polygon points="130,50 133,57 140,57 134,62 136,69 130,65 124,69 126,62 120,57 127,57" fill="#c084fc" opacity="0.6"/>
  <polygon points="270,50 273,57 280,57 274,62 276,69 270,65 264,69 266,62 260,57 267,57" fill="#c084fc" opacity="0.6"/>
  <polygon points="200,30 203,37 210,37 204,42 206,49 200,45 194,49 196,42 190,37 197,37" fill="#d4af37" opacity="0.8"/>
  <!-- Sparkles -->
  <circle cx="140" cy="90" r="2" fill="#00d2be" opacity="0.5"/>
  <circle cx="260" cy="85" r="2" fill="#00d2be" opacity="0.5"/>
  <circle cx="150" cy="150" r="1.5" fill="#c084fc" opacity="0.4"/>
  <circle cx="250" cy="145" r="1.5" fill="#c084fc" opacity="0.4"/>
  <!-- Number on base -->
  <text x="200" y="204" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="bold" fill="#1a0a2e">CHAMPIONS</text>
</svg>
