<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0a2e"/>
      <stop offset="100%" style="stop-color:#2d1450"/>
    </linearGradient>
    <linearGradient id="field" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a5c2a"/>
      <stop offset="100%" style="stop-color:#0f3d1a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="250" fill="url(#sky)"/>
  <!-- Stadium structure -->
  <path d="M30 180 Q200 130 370 180 L370 200 Q200 170 30 200 Z" fill="#1a0a2e" stroke="#c084fc" stroke-width="0.5"/>
  <path d="M50 180 Q200 140 350 180 L350 160 Q200 120 50 160 Z" fill="#2d1450" stroke="#c084fc" stroke-width="0.5"/>
  <!-- Floodlights -->
  <rect x="60" y="80" width="4" height="80" fill="#4a2070"/>
  <rect x="56" y="75" width="12" height="8" fill="#5b2d8a"/>
  <circle cx="62" cy="75" r="3" fill="#c084fc" opacity="0.8"/>
  <rect x="336" y="80" width="4" height="80" fill="#4a2070"/>
  <rect x="332" y="75" width="12" height="8" fill="#5b2d8a"/>
  <circle cx="338" cy="75" r="3" fill="#c084fc" opacity="0.8"/>
  <!-- Light beams -->
  <polygon points="62,75 30,160 94,160" fill="#c084fc" opacity="0.04"/>
  <polygon points="338,75 306,160 370,160" fill="#c084fc" opacity="0.04"/>
  <!-- Field -->
  <ellipse cx="200" cy="220" rx="150" ry="25" fill="url(#field)"/>
  <!-- Field markings -->
  <ellipse cx="200" cy="220" rx="30" ry="6" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <line x1="200" y1="195" x2="200" y2="245" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <!-- Stars in sky -->
  <circle cx="80" cy="30" r="1" fill="#c084fc" opacity="0.6"/>
  <circle cx="150" cy="50" r="1.5" fill="#d4af37" opacity="0.4"/>
  <circle cx="280" cy="35" r="1" fill="#00d2be" opacity="0.7"/>
  <circle cx="320" cy="55" r="1.2" fill="#c084fc" opacity="0.5"/>
  <circle cx="200" cy="25" r="1" fill="#d4af37" opacity="0.6"/>
  <!-- Terrain lines in sky -->
  <path d="M0 40 Q100 30 200 45 Q300 60 400 35" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="0.6"/>
  <path d="M0 55 Q100 45 200 60 Q300 75 400 50" fill="none" stroke="rgba(0,210,190,0.08)" stroke-width="0.6"/>
</svg>
