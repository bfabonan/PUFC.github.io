<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250">
  <defs>
    <linearGradient id="teamBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0a2e"/>
      <stop offset="100%" style="stop-color:#12082a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="250" fill="url(#teamBg)"/>
  <!-- Terrain lines background -->
  <path d="M0 20 Q150 10 300 25 Q400 35 400 30" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="0.6"/>
  <path d="M0 35 Q150 25 300 40 Q400 50 400 45" fill="none" stroke="rgba(0,210,190,0.06)" stroke-width="0.6"/>
  <path d="M0 230 Q150 220 300 235 Q400 245 400 240" fill="none" stroke="rgba(212,175,55,0.06)" stroke-width="0.6"/>
  <!-- Player 1 (center) -->
  <circle cx="200" cy="95" r="20" fill="#2d1450" stroke="#c084fc" stroke-width="2"/>
  <circle cx="200" cy="88" r="8" fill="#c084fc" opacity="0.7"/>
  <path d="M185 105 Q200 115 215 105 L220 145 Q200 155 180 145 Z" fill="#1a0a2e" stroke="#c084fc" stroke-width="1.5"/>
  <text x="200" y="132" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#d4af37">10</text>
  <!-- Player 2 (left) -->
  <circle cx="120" cy="110" r="18" fill="#2d1450" stroke="#c084fc" stroke-width="1.5"/>
  <circle cx="120" cy="104" r="7" fill="#c084fc" opacity="0.6"/>
  <path d="M107 125 Q120 133 133 125 L137 160 Q120 168 103 160 Z" fill="#1a0a2e" stroke="#c084fc" stroke-width="1.5"/>
  <text x="120" y="148" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#d4af37">7</text>
  <!-- Player 3 (right) -->
  <circle cx="280" cy="110" r="18" fill="#2d1450" stroke="#c084fc" stroke-width="1.5"/>
  <circle cx="280" cy="104" r="7" fill="#c084fc" opacity="0.6"/>
  <path d="M267 125 Q280 133 293 125 L297 160 Q280 168 263 160 Z" fill="#1a0a2e" stroke="#c084fc" stroke-width="1.5"/>
  <text x="280" y="148" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#d4af37">9</text>
  <!-- Player 4 (far left) -->
  <circle cx="60" cy="130" r="15" fill="#2d1450" stroke="#c084fc" stroke-width="1"/>
  <circle cx="60" cy="125" r="6" fill="#c084fc" opacity="0.5"/>
  <path d="M49 142 Q60 149 71 142 L74 170 Q60 177 46 170 Z" fill="#1a0a2e" stroke="#c084fc" stroke-width="1"/>
  <text x="60" y="161" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="bold" fill="#d4af37">3</text>
  <!-- Player 5 (far right) -->
  <circle cx="340" cy="130" r="15" fill="#2d1450" stroke="#c084fc" stroke-width="1"/>
  <circle cx="340" cy="125" r="6" fill="#c084fc" opacity="0.5"/>
  <path d="M329 142 Q340 149 351 142 L354 170 Q340 177 326 170 Z" fill="#1a0a2e" stroke="#c084fc" stroke-width="1"/>
  <text x="340" y="161" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="bold" fill="#d4af37">5</text>
  <!-- Football at bottom -->
  <circle cx="200" cy="200" r="15" fill="none" stroke="#d4af37" stroke-width="1.5"/>
  <polygon points="200,189 207,194 205,202 195,202 193,194" fill="#d4af37" opacity="0.4"/>
  <!-- Formation lines -->
  <line x1="120" y1="130" x2="200" y2="110" stroke="#00d2be" stroke-width="0.5" opacity="0.4" stroke-dasharray="4,4"/>
  <line x1="280" y1="130" x2="200" y2="110" stroke="#00d2be" stroke-width="0.5" opacity="0.4" stroke-dasharray="4,4"/>
  <line x1="60" y1="145" x2="120" y2="130" stroke="#00d2be" stroke-width="0.5" opacity="0.3" stroke-dasharray="4,4"/>
  <line x1="340" y1="145" x2="280" y2="130" stroke="#00d2be" stroke-width="0.5" opacity="0.3" stroke-dasharray="4,4"/>
  <!-- PUFC text -->
  <text x="200" y="240" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#c084fc" opacity="0.5">THE SQUAD</text>
</svg>
